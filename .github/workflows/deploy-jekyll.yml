name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches:
      - main # o master, a seconda del tuo branch principale

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Debug: mostra sorgente SCSS
        run: |
          echo "=== assets/css/main.scss ==="
          if [ -f assets/css/main.scss ]; then sed -n '1,160p' assets/css/main.scss; else echo "NO file assets/css/main.scss"; fi
          echo "=== ls assets/css ==="
          ls -la assets/css || true

      - name: Imposta Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Specifica la versione corretta per il tuo progetto
          bundler-cache: true
          cache-version: 0

      - name: Installa le dipendenze
        run: bundle install

      - name: Compila il sito Jekyll
        run: bundle exec jekyll build --destination ./_site --trace
        env:
          JEKYLL_ENV: production

      - name: Debug: mostra CSS compilato
        run: |
          echo "=== _site/assets/css/main.css ==="
          if [ -f _site/assets/css/main.css ]; then sed -n '1,240p' _site/assets/css/main.css; else echo "NO compiled file _site/assets/css/main.css"; fi
          echo "=== ls _site/assets/css ==="
          ls -la _site/assets/css || true

      - name: Carica l'artefatto di Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Esegui Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4