<section class="py-5" id="servizi" aria-labelledby="servizi-title">
  <div class="container">
    <h2 class="section-title" id="servizi-title">Cosa offriamo</h2>
    <div class="section-divider" aria-hidden="true"></div>

    <div class="lba-accordion" id="accordionServizi" aria-label="Elenco dei servizi offerti">
      
      {% for service in site.data.services %}
      <div class="accordion-item">
        <h3 class="accordion-header" id="heading{{ forloop.index }}">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.index }}" aria-expanded="false" aria-controls="collapse{{ forloop.index }}">
            <span class="service-icon me-3" aria-hidden="true">{{ service.icon }}</span> {{ service.title }}
          </button>
        </h3>
        <div id="collapse{{ forloop.index }}" class="accordion-collapse collapse" aria-labelledby="heading{{ forloop.index }}" data-bs-parent="#accordionServizi">
          <div class="accordion-body text-muted">
            {{ service.body }}
          </div>
        </div>
      </div>
      {% endfor %}

    </div>
  </div>
</section>
